name: Verify SeenSnap
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s deploy/tests -v
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: seensnap_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: seensnap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://seensnap_test:test_only@localhost:5432/seensnap_test
      TEST_DATABASE_URL: postgresql+psycopg://seensnap_test:test_only@localhost:5432/seensnap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e 'apps/api[dev]'
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest apps/api/tests -q
  mobile-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:client
      - run: npm run typecheck
      - run: npm run web:build
